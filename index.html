<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex · 个人简历主页</title>
    <!-- 国内CDN图标，iOS稳定加载 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg,#4158D0,#C850C0);
            color: #1e293b;
            line-height: 1.5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        /* 贪吃蛇容器居中 */
        .snake-box{
            text-align:center;
            margin-bottom:30px;
        }
        /* 毛玻璃卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15);
            padding: 2rem 1.8rem;
            margin-bottom: 24px;
            transition: transform 0.2s ease, box-shadow 0.3s;
        }
        .card:hover{
            transform: translateY(-5px);
            box-shadow: 0 24px 40px -10px rgba(0,0,0,0.18);
        }
        h1{
            font-size: 28px;
            color:#3c4fd9;
            margin-bottom:6px;
        }
        h2{
            color:#3c4fd9;
            border-left:4px solid #3c4fd9;
            padding-left:10px;
            margin:22px 0 10px;
        }
        .info-text{
            color:#555;
            margin-bottom:16px;
        }
        /* 技能标签 */
        .skill-tag{
            display:inline-block;
            background:#dbeafe;
            color:#2563eb;
            padding:5px 12px;
            border-radius:99px;
            margin:4px 5px;
        }
        ul{
            padding-left:22px;
            line-height:1.8;
        }
        .contact-item{
            margin:8px 0;
        }
        .contact-item i{
            color:#3c4fd9;
            margin-right:8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面顶部贪吃蛇动画【已替换国内ghproxy代理链接，解决无法加载】 -->
        <div class="snake-box">
            <img src="https://mirror.ghproxy.com/https://raw.githubusercontent.com/Platane/snk/output/github-contribution-grid-snake.svg" alt="贪吃蛇跑动动画">
        </div>

        <!-- 头部个人信息卡片 -->
        <div class="card">
            <h1>Alex</h1>
            <div class="info-text">大数据专业在读 | 求职：数据分析/数据处理实习</div>
            <div class="contact-item"><i class="fa-solid fa-envelope"></i>邮箱：2635989464@qq.com</div>
        </div>

        <!-- 教育经历 -->
        <div class="card">
            <h2>📖 教育经历</h2>
            <p>全日制大专｜大数据技术专业｜在读</p>
        </div>

        <!-- 专业技能 -->
        <div class="card">
            <h2>🛠️ 专业技能</h2>
            <div>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">SQL数据库</span>
                <span class="skill-tag">Excel数据处理</span>
                <span class="skill-tag">HTML/CSS</span>
                <span class="skill-tag">数据清洗</span>
            </div>
        </div>

        <!-- 项目经历 -->
        <div class="card">
            <h2>💻 项目经历</h2>
            <ul>
                <li>个人在线简历网站：HTML+CSS静态开发，部署在Github Pages</li>
                <li>Python简易数据统计脚本：实现表格数据清洗、批量汇总计算</li>
            </ul>
        </div>

        <!-- 自我评价 -->
        <div class="card">
            <h2>✨ 自我评价</h2>
            <p>专注大数据方向持续学习，熟练基础数据处理，擅长Python与SQL入门开发，踏实好学，寻找大数据相关实习岗位。</p>
        </div>
    </div>
</body>
</html>
