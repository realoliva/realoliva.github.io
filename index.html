<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex · 个人简历主页</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
            background: transparent;
            color: #1e293b;
            line-height: 1.5;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .snake-box{
            text-align:center;
            margin-bottom:32px;
        }
        /* iOS液态玻璃核心样式 */
        .card {
            /* 液态玻璃底色：超低透明度 */
            background: rgba(255,255,255,0.42);
            /* 双层毛玻璃，仿iOS流体虚化 */
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            /* 细微内外发光模拟液态折射 */
            border: 1px solid rgba(255,255,255,0.55);
            border-radius: 26px;
            box-shadow: 
                0 4px 22px rgba(0,0,0,0.06),
                inset 0 1px 0 rgba(255,255,255,0.65);
            padding: 2rem 1.8rem;
            margin-bottom:26px;
            /* 流体缓动动画 */
            transition: all 0.35s cubic-bezier(0.2,0,0.2,1);
        }
        /* hover 液态上浮拉伸，iOS灵动弹跳 */
        .card:hover{
            transform: translateY(-9px) scale(1.018);
            background: rgba(255,255,255,0.52);
            box-shadow: 
                0 12px 38px rgba(0,0,0,0.09),
                inset 0 1px 0 rgba(255,255,255,0.75);
        }
        h1{
            font-size: 28px;
            color:#3c4fd9;
            margin-bottom:6px;
        }
        h2{
            color:#3c4fd9;
            border-left:4px solid #3c4fd9;
            padding-left:10px;
            margin:22px 0 10px;
        }
        .info-text{
            color:#555;
            margin-bottom:16px;
        }
        /* 标签同步液态玻璃 */
        .skill-tag{
            display:inline-block;
            background:rgba(219, 234, 254,0.35);
            backdrop-filter: blur(10px);
            border:1px solid rgba(255,255,255,0.5);
            color:#2563eb;
            padding:5px 12px;
            border-radius:99px;
            margin:4px 5px;
            transition:0.25s;
        }
        .skill-tag:hover{
            background:rgba(219, 234, 254,0.55);
        }
        ul{
            padding-left:22px;
            line-height:1.8;
        }
        .contact-item{
            margin:8px 0;
        }
        .contact-item i{
            color:#3c4fd9;
            margin-right:8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="snake-box">
            <img src="https://mirror.ghproxy.com/https://raw.githubusercontent.com/Platane/snk/output/github-contribution-grid-snake.svg" alt="贪吃蛇跑动动画">
        </div>

        <div class="card">
            <h1>Alex</h1>
            <div class="info-text">大数据专业在读 | 求职：数据分析/数据处理实习</div>
            <div class="contact-item"><i class="fa-solid fa-envelope"></i>邮箱：2635989464@qq.com</div>
        </div>

        <div class="card">
            <h2>📖 教育经历</h2>
            <p>全日制大专｜大数据技术专业｜在读</p>
        </div>

        <div class="card">
            <h2>🛠️ 专业技能</h2>
            <div>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">SQL数据库</span>
                <span class="skill-tag">Excel数据处理</span>
                <span class="skill-tag">HTML/CSS</span>
                <span class="skill-tag">数据清洗</span>
            </div>
        </div>

        <div class="card">
            <h2>💻 项目经历</h2>
            <ul>
                <li>个人在线简历网站：HTML+CSS静态开发，部署在Github Pages</li>
                <li>Python简易数据统计脚本：实现表格数据清洗、批量汇总计算</li>
            </ul>
        </div>

        <div class="card">
            <h2>✨ 自我评价</h2>
            <p>专注大数据方向持续学习，熟练基础数据处理，擅长Python与SQL入门开发，踏实好学，寻找大数据相关实习岗位。</p>
        </div>
    </div>
</body>
</html>
